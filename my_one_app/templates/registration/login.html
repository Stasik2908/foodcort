{% extends 'base.html' %}

{% block title %}Log in — Savora{% endblock %}

{% block content %}
  <div class="auth-page wrap">
    <h1 data-i18n="loginTitle">Log in</h1>
    <form class="auth-form" method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-dark" data-i18n="login" type="submit">Log in</button>
    </form>
    <p><span data-i18n="newToSavora">New to Savora?</span> <a data-i18n="createAccount" href="{% url 'register' %}">Create an account</a>.</p>
  </div>
{% endblock %}
